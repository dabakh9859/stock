<!DOCTYPE html>
<html lang="fr" data-theme="dark">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Fonctionnalité non incluse — {{ app_name }}</title>
  <style>
    :root { color-scheme: dark; }
    body {
      margin: 0;
      font-family: "Inter", ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
      background: hsl(240 10% 3.9%);
      color: hsl(0 0% 98%);
      display: grid;
      place-items: center;
      min-height: 100vh;
      padding: 1.5rem;
      box-sizing: border-box;
    }
    .box {
      max-width: 28rem;
      text-align: center;
      background: hsl(240 10% 5.5%);
      border: 1px solid hsl(240 4% 16%);
      border-radius: 0.75rem;
      padding: 2.5rem 2rem;
    }
    .icon { font-size: 2rem; margin-bottom: 1rem; }
    h1 { font-size: 1.25rem; letter-spacing: -0.02em; margin: 0 0 0.75rem; }
    p { color: hsl(240 5% 64.9%); font-size: 0.9375rem; line-height: 1.6; margin: 0 0 1.5rem; }
    a {
      display: inline-block;
      background: hsl(0 0% 98%);
      color: hsl(240 6% 10%);
      text-decoration: none;
      font-weight: 600;
      font-size: 0.875rem;
      padding: 0.625rem 1.25rem;
      border-radius: 0.5rem;
    }
    a.ghost { background: transparent; color: hsl(0 0% 98%); border: 1px solid hsl(240 4% 16%); margin-left: 0.5rem; }
  </style>
</head>

<body>
  <div class="box">
    <div class="icon">🔒</div>
    <h1>Cette fonctionnalité n'est pas dans votre plan</h1>
    <p>Votre abonnement <strong>{{ plan_label }}</strong> n'inclut pas
      {{ feature_label }}. Passez au plan supérieur pour la débloquer —
      le changement est immédiat.</p>
    <a href="{{ upgrade_url }}">Voir les plans</a>
    <a class="ghost" href="{{ url_prefix }}/">Retour</a>
  </div>
</body>

</html>
